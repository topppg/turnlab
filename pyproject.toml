[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "turnlab"
version = "0.1.0"
description = "A privacy-first evaluation harness for the media layer of real-time voice agents"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Giorgio Sarno" }]
keywords = ["voice-agents", "evaluation", "websocket", "latency", "testing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
elevenlabs = ["websockets>=14,<16"]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[project.scripts]
turnlab = "turnlab.cli:main"

[project.urls]
Repository = "https://github.com/topppg/turnlab"

[tool.hatch.build.targets.wheel]
packages = ["src/turnlab"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
